<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Rocket Crash RNG Game</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --accent-green: #2ea44f;
            --accent-red: #da3633;
            --accent-gold: #f1e05a;
            --text-color: #c9d1d9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .game-container {
            width: 100%;
            max-width: 900px;
            background: var(--panel-bg);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 1px solid #30363d;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #21262d;
            border-bottom: 1px solid #30363d;
        }

        .balance-card {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-gold);
        }

        .history-bar {
            display: flex;
            gap: 8px;
            padding: 10px 20px;
            background: #0d1117;
            overflow-x: auto;
            border-bottom: 1px solid #30363d;
        }

        .history-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .badge-win { background: rgba(46, 164, 79, 0.2); color: #3fb950; border: 1px solid #3fb950; }
        .badge-loss { background: rgba(218, 54, 51, 0.2); color: #f85149; border: 1px solid #f85149; }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 350px;
            background: radial-gradient(circle, #1a2332 0%, #0d1117 100%);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .multiplier-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
            pointer-events: none;
        }

        .multiplier-overlay.crashed {
            color: var(--accent-red);
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            padding: 20px;
            background: #161b22;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 0.85rem;
            color: #8b949e;
        }

        input {
            width: 100%;
            padding: 10px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: #58a6ff;
        }

        .btn {
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-launch {
            background-color: var(--accent-green);
            color: white;
        }

        .btn-launch:hover {
            background-color: #2c974b;
        }

        .btn-cashout {
            background-color: var(--accent-gold);
            color: #000;
        }

        .btn-cashout:hover {
            background-color: #e3d03f;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            .canvas-container { height: 250px; }
            .multiplier-overlay { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <h2>🚀 Crash RNG Game</h2>
        <div class="balance-card">💰 Balance: $<span id="balance">1000.00</span></div>
    </div>

    <div class="history-bar" id="history">
        <!-- Recent multiplier history badges -->
    </div>

    <div class="canvas-container">
        <canvas id="gameCanvas"></canvas>
        <div class="multiplier-overlay" id="multiplier">1.00x</div>
    </div>

    <div class="controls">
        <div class="input-group">
            <label for="betAmount">Bet Amount ($)</label>
            <input type="number" id="betAmount" value="10" min="1" step="1">
        </div>
        <div class="input-group">
            <label for="autoCashout">Auto Cash-Out (x)</label>
            <input type="number" id="autoCashout" value="2.00" min="1.01" step="0.1">
        </div>
        <div class="input-group" style="justify-content: flex-end;">
            <button class="btn btn-launch" id="actionBtn">START LAUNCH</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const multiplierEl = document.getElementById('multiplier');
    const balanceEl = document.getElementById('balance');
    const actionBtn = document.getElementById('actionBtn');
    const betInput = document.getElementById('betAmount');
    const autoCashoutInput = document.getElementById('autoCashout');
    const historyEl = document.getElementById('history');

    // Game state variables
    let balance = 1000.00;
    let currentMultiplier = 1.00;
    let crashPoint = 0;
    let isRunning = false;
    let isCashedOut = false;
    let animationId = null;
    let startTime = 0;

    // Rocket Canvas Physics
    let rocket = { x: 50, y: 0 };
    let trail = [];

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
        rocket.y = canvas.height - 40;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // RNG Crash Calculation
    function generateCrashPoint() {
        const e = 2 ** 32;
        const h = crypto.getRandomValues(new Uint32Array(1))[0];
        // 3% house edge with realistic RNG distribution
        if (h % 33 === 0) return 1.00; 
        return Math.max(1.00, parseFloat(((100 * e - h) / (e - h) / 100).toFixed(2)));
    }

    function updateHistory(val, isWin) {
        const badge = document.createElement('div');
        badge.className = `history-badge ${isWin ? 'badge-win' : 'badge-loss'}`;
        badge.innerText = `${val.toFixed(2)}x`;
        historyEl.prepend(badge);
        if (historyEl.children.length > 10) historyEl.removeChild(historyEl.lastChild);
    }

    function drawRocket() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Grid lines
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.lineWidth = 1;
        for (let i = 0; i < canvas.width; i += 40) {
            ctx.beginPath();
            ctx.moveTo(i, 0);
            ctx.lineTo(i, canvas.height);
            ctx.stroke();
        }

        // Draw trail curve
        if (trail.length > 1) {
            ctx.beginPath();
            ctx.moveTo(trail[0].x, trail[0].y);
            for (let i = 1; i < trail.length; i++) {
                ctx.lineTo(trail[i].x, trail[i].y);
            }
            ctx.strokeStyle = isCashedOut ? '#2ea44f' : '#388bfd';
            ctx.lineWidth = 4;
            ctx.stroke();
        }

        // Draw Rocket
        ctx.save();
        ctx.translate(rocket.x, rocket.y);
        ctx.font = '28px sans-serif';
        ctx.fillText('🚀', -15, 10);
        ctx.restore();
    }

    function gameLoop(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) / 1000;

        // Exponential multiplier increase
        currentMultiplier = parseFloat((Math.pow(Math.E, 0.06 * elapsed)).toFixed(2));

        // Canvas animation positions
        const progress = Math.min(elapsed / 15, 1);
        rocket.x = 50 + (canvas.width - 100) * progress;
        rocket.y = (canvas.height - 40) - (canvas.height - 80) * Math.pow(progress, 0.7);

        trail.push({ x: rocket.x, y: rocket.y });

        multiplierEl.innerText = `${currentMultiplier.toFixed(2)}x`;

        // Check Auto Cash-Out
        const autoVal = parseFloat(autoCashoutInput.value);
        if (!isCashedOut && autoVal && currentMultiplier >= autoVal) {
            cashOut();
        }

        // Check Crash
        if (currentMultiplier >= crashPoint) {
            endGame(false);
            return;
        }

        drawRocket();
        if (isRunning) {
            animationId = requestAnimationFrame(gameLoop);
        }
    }

    function startGame() {
        const bet = parseFloat(betInput.value);
        if (isNaN(bet) || bet <= 0 || bet > balance) {
            alert('Invalid bet amount or insufficient balance!');
            return;
        }

        balance -= bet;
        balanceEl.innerText = balance.toFixed(2);

        isRunning = true;
        isCashedOut = false;
        currentMultiplier = 1.00;
        startTime = 0;
        trail = [];
        rocket = { x: 50, y: canvas.height - 40 };
        
        crashPoint = generateCrashPoint();

        multiplierEl.classList.remove('crashed');
        actionBtn.innerText = 'CASH OUT';
        actionBtn.className = 'btn btn-cashout';

        animationId = requestAnimationFrame(gameLoop);
    }

    function cashOut() {
        if (!isRunning || isCashedOut) return;

        isCashedOut = true;
        const bet = parseFloat(betInput.value);
        const winAmount = bet * currentMultiplier;
        balance += winAmount;
        balanceEl.innerText = balance.toFixed(2);

        actionBtn.innerText = `WON $${winAmount.toFixed(2)}`;
        actionBtn.disabled = true;
    }

    function endGame(isManualWin) {
        isRunning = false;
        cancelAnimationFrame(animationId);

        multiplierEl.innerText = `${crashPoint.toFixed(2)}x CRASHED!`;
        multiplierEl.classList.add('crashed');

        updateHistory(crashPoint, isCashedOut);

        actionBtn.innerText = 'START LAUNCH';
        actionBtn.className = 'btn btn-launch';
        actionBtn.disabled = false;
    }

    actionBtn.addEventListener('click', () => {
        if (!isRunning) {
            startGame();
        } else if (!isCashedOut) {
            cashOut();
        }
    });
</script>

</body>
</html>
